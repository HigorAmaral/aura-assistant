<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AURA — Assistente no Topo da Tela</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
  <style>
    :root {
      --night: #0D0E1A;
      --dusk: #161829;
      --dusk-2: #1F2238;
      --line: rgba(196, 205, 245, .12);
      --ink: #F1F3FF;
      --mist: #A6ACCB;
      --glow: #9BF35A;
      --lavender: #BFCDF5;
      --sky: #5AD8FF;
      --rose: #FF7AC8;
      --warn: #FFB340;
      --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
      --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
      color-scheme: dark;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      color: var(--ink);
      font: 400 14px/1.45 var(--font-body);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      user-select: none;
    }

    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    input, select { font: inherit; color: inherit; }

    /* O Entalho (Notch) no topo da tela */
    .notch-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      position: relative;
    }

    .notch {
      position: relative;
      background: #000000;
      border-radius: 0 0 18px 18px;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .08);
      border-top: 0;
      box-shadow: 0 6px 26px rgba(0, 0, 0, .55), 0 0 18px rgba(155, 243, 90, .16);
      transition: border-radius .3s ease, box-shadow .3s ease;
    }

    body.expanded .notch {
      border-radius: 0 0 28px 28px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, .75), 0 0 28px rgba(155, 243, 90, .2);
    }

    /* Pill Compacta (quando fechado) */
    .pill {
      position: absolute;
      inset: 0;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 14px;
      cursor: pointer;
      transition: opacity .18s ease;
    }
    body.expanded .pill {
      opacity: 0;
      pointer-events: none;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--glow);
      box-shadow: 0 0 10px var(--glow);
      flex: none;
    }
    .dot.listen { background: #FF453A; box-shadow: 0 0 10px #FF453A; animation: pulseDot 1s infinite; }
    .dot.think { background: #FFD60A; box-shadow: 0 0 10px #FFD60A; animation: pulseDot 1s infinite; }
    @keyframes pulseDot { 50% { opacity: .35; transform: scale(1.2); } }

    .live {
      font: 700 13px var(--font-body);
      color: var(--glow);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 7px;
      font-variant-numeric: tabular-nums;
    }
    .live .nm { color: var(--mist); font-weight: 600; max-width: 130px; overflow: hidden; text-overflow: ellipsis; }
    .live.work { color: #FFD25A; }
    .live.work .wk { display: inline-block; animation: wkb .9s ease-in-out infinite; }
    @keyframes wkb { 50% { transform: translateY(-2px) rotate(-12deg); } }

    .eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; }
    .eq b { width: 3px; background: #1ED760; border-radius: 2px; animation: eq .9s ease-in-out infinite; }
    .eq b:nth-child(2) { animation-delay: -.3s; }
    .eq b:nth-child(3) { animation-delay: -.6s; }
    @keyframes eq { 0%, 100% { height: 3px; } 50% { height: 12px; } }

    /* Painel Expandido */
    .panel {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 170px 1fr;
      gap: 14px;
      padding: 16px 18px 16px 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s .06s;
    }
    body.expanded .panel {
      opacity: 1;
      pointer-events: auto;
    }

    /* Barra Lateral */
    .side {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .me {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 4px 10px;
    }
    .me b {
      display: block;
      font: 700 15.5px var(--font-display);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 96px;
    }
    .me small {
      display: block;
      font: 500 10.5px var(--font-mono);
      color: var(--mist);
    }
    .lv {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 3px;
    }
    .lv em {
      font: 800 10px var(--font-body);
      font-style: normal;
      color: #FFD25A;
    }
    .lv i {
      width: 54px;
      height: 5px;
      border-radius: 4px;
      background: rgba(255, 255, 255, .12);
      overflow: hidden;
      display: block;
    }
    .lv i b {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #FFD25A, #FF9F0A);
      transition: width .4s;
    }

    .nv {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 9px;
      border-radius: 11px;
      font-size: 13px;
      font-weight: 600;
      color: var(--mist);
      text-align: left;
      transition: background .15s, color .15s;
    }
    .nv:hover { background: rgba(255, 255, 255, .06); color: var(--ink); }
    .nv.on { background: rgba(155, 243, 90, .14); color: var(--glow); }
    .nv .c {
      margin-left: auto;
      font-size: 10.5px;
      background: rgba(255, 255, 255, .1);
      color: var(--ink);
      padding: 1px 6px;
      border-radius: 8px;
    }

    .side-foot {
      margin-top: auto;
      display: flex;
      gap: 5px;
      padding-top: 6px;
    }
    .sbtn {
      flex: 1;
      padding: 6px 8px;
      border-radius: 9px;
      background: rgba(255, 255, 255, .07);
      font-size: 11px;
      font-weight: 700;
      color: var(--mist);
      text-align: center;
      transition: all .15s;
    }
    .sbtn:hover { background: rgba(255, 255, 255, .14); color: var(--ink); }
    .sbtn.primary { background: rgba(155, 243, 90, .16); color: var(--glow); }
    .sbtn.primary:hover { background: rgba(155, 243, 90, .28); }

    /* Área Principal */
    .main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .main-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .main h4 {
      margin: 0;
      font: 800 20px var(--font-display);
      letter-spacing: -.02em;
    }
    .main .sub {
      color: var(--mist);
      font-size: 12px;
      margin: 1px 0 9px;
    }

    .scroll-area {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-right: 2px;
    }
    .scroll-area::-webkit-scrollbar { width: 4px; }
    .scroll-area::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .15); border-radius: 99px; }

    /* Barra de Pergunta + Mic */
    .ask {
      display: flex;
      gap: 6px;
      align-items: center;
      background: #141416;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 22px;
      padding: 4px 4px 4px 14px;
      transition: border-color .18s;
    }
    .ask:focus-within { border-color: var(--glow); }
    .ask input {
      flex: 1;
      background: transparent;
      border: 0;
      outline: 0;
      color: var(--ink);
      font-size: 13.5px;
      min-width: 0;
      user-select: text;
    }
    .ask input::placeholder { color: rgba(255, 255, 255, .4); }
    .ask-send {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .1);
      color: var(--ink);
      display: grid;
      place-items: center;
      font-size: 13px;
      transition: background .15s;
    }
    .ask-send:hover { background: rgba(255, 255, 255, .2); }
    .mic {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--glow);
      color: #000;
      display: grid;
      place-items: center;
      flex: none;
      transition: transform .15s, background .15s;
    }
    .mic:hover { transform: scale(1.06); }
    .mic.on { background: #FF453A; color: #fff; animation: pulseDot 1s infinite; }
    .mic svg { width: 16px; height: 16px; }

    /* Chips de Sugestão */
    .chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .chip {
      padding: 5px 10px;
      border-radius: 14px;
      background: rgba(255, 255, 255, .08);
      font-size: 11.5px;
      font-weight: 700;
      transition: background .15s, color .15s;
    }
    .chip:hover { background: rgba(155, 243, 90, .2); color: var(--glow); }

    /* Home: Conversa + Mini Card */
    .hmid {
      display: flex;
      gap: 10px;
      flex: 1;
      min-height: 0;
      margin-top: 9px;
    }
    .convo {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      background: #141416;
      border: 1px solid rgba(255, 255, 255, .07);
      border-radius: 14px;
      padding: 9px 11px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      user-select: text;
    }
    .convo::-webkit-scrollbar { width: 3px; }
    .convo::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .14); border-radius: 99px; }

    .m {
      max-width: 88%;
      font-size: 12.5px;
      line-height: 1.4;
      padding: 6px 10px;
      border-radius: 12px;
      word-break: break-word;
    }
    .m.u { align-self: flex-end; background: rgba(155, 243, 90, .2); color: var(--ink); }
    .m.k { align-self: flex-start; background: #1f1f25; color: var(--ink); }

    /* Mini Player + Telemetria */
    .mini {
      width: 205px;
      flex: none;
      align-self: flex-start;
      background: linear-gradient(160deg, #1b2a14, #111114 72%);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .mini .top { display: flex; gap: 9px; align-items: center; min-width: 0; }
    .mini .art {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      flex: none;
      display: grid;
      place-items: center;
      font-size: 16px;
      background: linear-gradient(135deg, #2b4a1e, #12151f);
    }
    .mini b {
      display: block;
      font: 800 12.5px var(--font-display);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mini small { color: var(--mist); font-size: 11px; display: block; }
    .ctl { display: flex; gap: 6px; align-items: center; justify-content: space-between; }
    .ctl button {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .09);
      font-size: 11px;
      display: grid;
      place-items: center;
      transition: background .15s;
    }
    .ctl button:hover { background: rgba(255, 255, 255, .18); }
    .ctl button.pp {
      width: 34px;
      height: 34px;
      background: #fff;
      color: #000;
      font-weight: 800;
    }
    .mini-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, .08);
      font: 600 11px var(--font-mono);
      color: var(--mist);
    }
    .mini-stats span b { display: inline; font: 700 11px var(--font-mono); color: var(--glow); }

    /* Linhas / Cards */
    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 11px;
      background: #141416;
      border: 1px solid rgba(255, 255, 255, .07);
      border-radius: 12px;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
    }
    .row .t { flex: 1; min-width: 0; }
    .row .t small { display: block; color: var(--mist); font-weight: 500; font-size: 11px; }
    .ck {
      width: 19px;
      height: 19px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, .35);
      flex: none;
      transition: all .15s;
      display: grid;
      place-items: center;
      font-size: 11px;
      color: #000;
    }
    .ck.on { background: var(--glow); border-color: var(--glow); }
    .row.done .t { color: var(--mist); text-decoration: line-through; }
    .rb {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .08);
      font-weight: 800;
      flex: none;
      display: grid;
      place-items: center;
    }
    .rb:hover { background: rgba(255, 255, 255, .16); }
    .rb.plus { background: rgba(155, 243, 90, .2); color: var(--glow); }
    .bar { height: 5px; border-radius: 4px; background: rgba(255, 255, 255, .1); overflow: hidden; margin-top: 4px; }
    .bar i { display: block; height: 100%; background: var(--glow); transition: width .3s; }
    .tm { font: 800 20px var(--font-display); font-variant-numeric: tabular-nums; color: var(--glow); }

    /* Grid de ações Sistema */
    .sys-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-bottom: 8px;
    }
    .sys-tile {
      background: #141416;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 11px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 7px;
      text-align: left;
      transition: border-color .15s, background .15s;
    }
    .sys-tile:hover { border-color: var(--glow); background: rgba(155, 243, 90, .08); }

    .term-box {
      background: #0a0b10;
      border: 1px solid rgba(155, 243, 90, .25);
      border-radius: 11px;
      padding: 8px 10px;
      font: 500 11px/1.4 var(--font-mono);
      color: var(--glow);
      height: 110px;
      overflow-y: auto;
      white-space: pre-wrap;
      user-select: text;
      margin-top: 6px;
    }

    /* Personalizar */
    .cust-sec { margin-bottom: 10px; }
    .cust-sec label { display: block; font: 700 11px var(--font-mono); color: var(--mist); margin-bottom: 5px; text-transform: uppercase; }
    .swatches { display: flex; gap: 6px; flex-wrap: wrap; }
    .swatch {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid transparent;
      transition: transform .15s, border-color .15s;
    }
    .swatch.on { border-color: #fff; transform: scale(1.12); }

    /* Toast Flutuante */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      z-index: 90;
      background: rgba(13, 14, 26, .95);
      border: 1px solid rgba(155, 243, 90, .4);
      color: var(--ink);
      padding: 6px 13px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s;
      white-space: nowrap;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .5);
    }
  </style>
</head>
<body>
  <div class="notch-wrap">
    <div class="notch" id="notch">
      <div class="pill" id="pill"></div>
      <div class="panel">
        <div class="side" id="side"></div>
        <div class="main" id="dmain"></div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    /* ====== MASCOTE SVG (Estilo Kobi com 13 humores, olhos que seguem o mouse e acessórios) ====== */
    (function () {
      const MOODS = {
        idle: 'Repouso', listen: 'Ouvindo', think: 'Pensando', talk: 'Falando', happy: 'Feliz', laugh: 'Rindo',
        love: 'Carinho', cool: 'Descolado', surprised: 'Surpreso', angry: 'Bravo', cry: 'Chorando', sleep: 'Dormindo', success: 'Conseguiu!',
      };
      const EYES = { round: 'Redondos', oval: 'Ovais', pixel: 'Pixel', big: 'Grandões', line: 'Tracinho' };
      const ACCESSORIES = {
        none: 'Nenhum', party: 'Festa', crown: 'Coroa', headphones: 'Fones', bow: 'Laço', beanie: 'Gorro',
        cap: 'Boné', glasses: 'Óculos', halo: 'Auréola', horns: 'Chifrinhos', flower: 'Florzinha', santa: 'Natal',
      };
      const BODIES = [
        ['Nuvem', '#F4F7FF', '#BFCDF5'], ['Menta', '#E8FFF4', '#9EE6C3'], ['Pêssego', '#FFF1E8', '#FFC2A3'],
        ['Lavanda', '#F6EEFF', '#CDB4FF'], ['Limão', '#FBFFE6', '#DDEB8A'], ['Céu', '#EAF7FF', '#94D0FF'],
        ['Rosa', '#FFEFF6', '#FFB3D1'], ['Grafite', '#6B6F7E', '#3A3D48'], ['Ouro', '#FFF6D6', '#F2C94C'],
      ];
      const EYE_COLORS = ['#9BF35A', '#5AD8FF', '#FF7AC8', '#FFD25A', '#FFFFFF', '#FF5A5A', '#B78CFF'];

      function eyesFor(mood, style, c) {
        const L = 15, R = 25, Y = 18;
        const shape = (x, extra = '') => {
          if (style === 'pixel') return `<rect x="${x - 2.4}" y="${Y - 3}" width="4.8" height="6" rx="0.6" fill="${c}" ${extra}/>`;
          if (style === 'oval') return `<ellipse cx="${x}" cy="${Y}" rx="2.2" ry="3.6" fill="${c}" ${extra}/>`;
          if (style === 'big') return `<circle cx="${x}" cy="${Y}" r="3.7" fill="${c}" ${extra}/><circle cx="${x - 1.2}" cy="${Y - 1.4}" r="1.1" fill="#fff" opacity=".85"/>`;
          if (style === 'line') return `<rect x="${x - 3}" y="${Y - 0.9}" width="6" height="1.8" rx="0.9" fill="${c}" ${extra}/>`;
          return `<ellipse cx="${x}" cy="${Y}" rx="2.6" ry="3.3" fill="${c}" ${extra}/>`;
        };
        const arcUp = (x) => `<path d="M${x - 3} ${Y + 1.2} Q${x} ${Y - 3.2} ${x + 3} ${Y + 1.2}" stroke="${c}" stroke-width="1.9" fill="none" stroke-linecap="round"/>`;
        const arcDown = (x) => `<path d="M${x - 3} ${Y - 1} Q${x} ${Y + 2.6} ${x + 3} ${Y - 1}" stroke="${c}" stroke-width="1.9" fill="none" stroke-linecap="round"/>`;
        const heart = (x) => `<path d="M${x} ${Y + 3} l-3.2 -3.2 a1.9 1.9 0 0 1 3.2 -2.4 a1.9 1.9 0 0 1 3.2 2.4z" fill="#FF5A8A"/>`;
        const star = (x) => `<path d="M${x} ${Y - 3.6} l1.1 2.4 2.6.3-1.9 1.8.5 2.6-2.3-1.3-2.3 1.3.5-2.6-1.9-1.8 2.6-.3z" fill="#FFD25A"/>`;
        switch (mood) {
          case 'happy': return arcUp(L) + arcUp(R);
          case 'laugh': return arcUp(L) + arcUp(R) + `<path d="M17 21.5 Q20 25 23 21.5z" fill="${c}"/>`;
          case 'love': return heart(L) + heart(R);
          case 'success': return star(L) + star(R);
          case 'sleep': return arcDown(L) + arcDown(R);
          case 'cool': return `<rect x="9.5" y="14.5" width="21" height="6.4" rx="3" fill="#0A0A0E"/><rect x="11" y="15.6" width="7" height="2" rx="1" fill="#fff" opacity=".35"/>`;
          case 'surprised': return `<circle cx="${L}" cy="${Y}" r="3.8" fill="none" stroke="${c}" stroke-width="1.6"/><circle cx="${R}" cy="${Y}" r="3.8" fill="none" stroke="${c}" stroke-width="1.6"/><ellipse cx="20" cy="23" rx="1.4" ry="1.7" fill="${c}"/>`;
          case 'angry': return shape(L) + shape(R) + `<path d="M11.5 12.8 L18 15" stroke="${c}" stroke-width="1.6" stroke-linecap="round"/><path d="M28.5 12.8 L22 15" stroke="${c}" stroke-width="1.6" stroke-linecap="round"/>`;
          case 'cry': return arcDown(L) + arcDown(R) + `<path d="M13 20.5 q-1 2.5 0 3.6 q1 -1.1 0 -3.6z" fill="#5AD8FF"/><path d="M27 20.5 q-1 2.5 0 3.6 q1 -1.1 0 -3.6z" fill="#5AD8FF"/>`;
          case 'think': return `<g transform="translate(1.2 -1.6)">${shape(L)}${shape(R)}</g><circle cx="31" cy="12" r=".9" fill="${c}" opacity=".7"/>`;
          default: return shape(L) + shape(R);
        }
      }

      function accessory(a) {
        switch (a) {
          case 'party': return '<path d="M12 7 L17 -6 L22 7z" fill="#FF5AA0"/><path d="M13.6 3 l7 0" stroke="#FFD25A" stroke-width="1.4"/><circle cx="17" cy="-6.5" r="1.8" fill="#FFD25A"/>';
          case 'crown': return '<path d="M10 7 L11 -1 L15.5 3.5 L20 -3 L24.5 3.5 L29 -1 L30 7z" fill="#F2C94C" stroke="#C99A1B" stroke-width=".7"/><circle cx="20" cy="2.5" r="1.2" fill="#FF5A5A"/>';
          case 'headphones': return '<path d="M4 19 Q4 2 20 2 Q36 2 36 19" stroke="#2B2E3B" stroke-width="2.6" fill="none"/><rect x="0.5" y="15" width="5.5" height="10" rx="2.5" fill="#FF5A8A"/><rect x="34" y="15" width="5.5" height="10" rx="2.5" fill="#FF5A8A"/>';
          case 'bow': return '<path d="M26 6 l-5 -4 v8z M26 6 l5 -4 v8z" fill="#FF5AA0"/><circle cx="26" cy="6" r="1.6" fill="#D93A7E"/>';
          case 'beanie': return '<path d="M5 10 Q5 -2 20 -2 Q35 -2 35 10z" fill="#5A7CFF"/><rect x="4" y="7.5" width="32" height="4" rx="2" fill="#3F5BD9"/><circle cx="20" cy="-3" r="2.6" fill="#fff"/>';
          case 'santa': return '<path d="M6 9 Q8 -3 22 -2 Q30 -1 34 6 L36 9z" fill="#E53935"/><rect x="4" y="7" width="32" height="4" rx="2" fill="#fff"/><circle cx="35" cy="5" r="2.4" fill="#fff"/>';
          case 'cap': return '<path d="M6 10 Q6 0 20 0 Q32 0 33 10z" fill="#30D158"/><path d="M20 9 L40 10 L38 12 L20 11z" fill="#1E9E43"/>';
          case 'glasses': return '<circle cx="15" cy="18" r="5" fill="none" stroke="#2B2E3B" stroke-width="1.4"/><circle cx="25" cy="18" r="5" fill="none" stroke="#2B2E3B" stroke-width="1.4"/><path d="M20 18h0" stroke="#2B2E3B" stroke-width="1.4"/>';
          case 'halo': return '<ellipse cx="20" cy="-1" rx="9" ry="2.6" fill="none" stroke="#FFD25A" stroke-width="1.8"/>';
          case 'horns': return '<path d="M9 8 L7 0 L13 6z" fill="#FF5A5A"/><path d="M31 8 L33 0 L27 6z" fill="#FF5A5A"/>';
          case 'flower': return '<g transform="translate(29 5)"><circle r="2.2" cx="0" cy="-2.6" fill="#FF9EC8"/><circle r="2.2" cx="2.5" cy="0" fill="#FF9EC8"/><circle r="2.2" cx="0" cy="2.6" fill="#FF9EC8"/><circle r="2.2" cx="-2.5" cy="0" fill="#FF9EC8"/><circle r="1.6" fill="#FFD25A"/></g>';
          default: return '';
        }
      }

      function svg(o = {}) {
        const k = { body: '#F4F7FF', body2: '#BFCDF5', visor: '#1B1E2B', eye: '#9BF35A', eyeStyle: 'round', accessory: 'none', antenna: true, blink: true, ...o };
        const size = k.size || 40;
        const id = 'au' + (k.uid || Math.random().toString(36).slice(2, 7));
        const mood = k.mood || 'idle';
        const antC = mood === 'listen' ? '#FF453A' : mood === 'think' ? '#FFD60A' : mood === 'talk' ? '#5AD8FF' : k.eye;
        const ant = k.antenna && !['crown', 'beanie', 'santa', 'cap', 'party'].includes(k.accessory)
          ? `<line x1="27" y1="7" x2="31" y2="1.8" stroke="${k.body2}" stroke-width="2" stroke-linecap="round"/><circle class="kb-ant${mood === 'listen' || mood === 'think' ? ' kb-pulse' : ''}" cx="31.5" cy="1.8" r="2.4" fill="${antC}"/>` : '';
        const waves = mood === 'listen' ? '<path class="kb-wave" d="M37 14 q2.5 4 0 8" stroke="#FF453A" stroke-width="1.3" fill="none" stroke-linecap="round"/><path class="kb-wave kb-w2" d="M39.5 12 q3.8 6 0 12" stroke="#FF453A" stroke-width="1.1" fill="none" stroke-linecap="round" opacity=".7"/>' : '';
        const zz = mood === 'sleep' ? '<text x="33" y="6" font-size="6" font-weight="800" fill="#9BB0FF" class="kb-zz">z</text>' : '';
        const blink = k.blink && ['idle', 'listen', 'talk', 'think', 'angry'].includes(mood) ? ' kb-blink' : '';
        return `<svg class="kobi kb-${mood}" width="${size}" height="${size * 0.8}" viewBox="-2 -8 44 40" overflow="visible">
          <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${k.body}"/><stop offset="1" stop-color="${k.body2}"/></linearGradient></defs>
          ${ant}
          <g class="kb-bodyg"><rect x="3" y="6" width="34" height="25" rx="11" fill="url(#${id})"/>
          <rect x="7" y="11" width="26" height="14" rx="7" fill="${k.visor}"/>
          <g class="kb-eyes" data-eyes><g class="kb-eyein${blink}">${eyesFor(mood, k.eyeStyle, k.eye)}</g></g>
          ${mood === 'talk' ? `<rect class="kb-mouth" x="17.5" y="22" width="5" height="1.6" rx=".8" fill="${k.eye}"/>` : ''}
          ${['love', 'happy', 'laugh'].includes(mood) ? '<ellipse cx="9.5" cy="23" rx="2" ry="1.1" fill="#FF8FB1" opacity=".55"/><ellipse cx="30.5" cy="23" rx="2" ry="1.1" fill="#FF8FB1" opacity=".55"/>' : ''}
          ${accessory(k.accessory)}</g>${waves}${zz}
        </svg>`;
      }

      const CSS = `
        .kobi { overflow: visible; display: block; flex: none; }
        .kobi .kb-eyes { transition: transform .12s ease-out; }
        .kobi .kb-blink { animation: kbBlink 5s infinite; transform-origin: center; transform-box: fill-box; }
        @keyframes kbBlink { 0%, 93%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
        .kobi .kb-pulse { animation: kbPulse 1s infinite; }
        @keyframes kbPulse { 50% { opacity: .3; } }
        .kobi .kb-wave { animation: kbWave 1s infinite; } .kobi .kb-w2 { animation-delay: .25s; }
        @keyframes kbWave { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
        .kobi.kb-talk .kb-mouth { animation: kbTalk .28s infinite alternate; transform-origin: center; transform-box: fill-box; }
        @keyframes kbTalk { to { transform: scaleY(2.6); } }
        .kobi.kb-laugh .kb-bodyg, .kobi.kb-happy .kb-bodyg { animation: kbBounce .5s ease-in-out 3; transform-origin: 50% 100%; transform-box: fill-box; }
        @keyframes kbBounce { 50% { transform: translateY(-1.6px); } }
        .kobi.kb-angry .kb-bodyg { animation: kbShake .12s 6; } @keyframes kbShake { 50% { transform: translateX(.8px); } }
        .kobi.kb-surprised .kb-bodyg { animation: kbPop .3s ease; transform-origin: 50% 100%; transform-box: fill-box; } @keyframes kbPop { 50% { transform: scale(1.08); } }
        .kobi .kb-zz { animation: kbZz 2s infinite; } @keyframes kbZz { 0% { opacity: 0; transform: translate(0,0); } 50% { opacity: 1; } 100% { opacity: 0; transform: translate(3px,-5px); } }
      `;
      const styleEl = document.createElement('style');
      styleEl.textContent = CSS;
      document.head.appendChild(styleEl);

      window.AURA_MASCOT = { svg, MOODS, EYES, ACCESSORIES, BODIES, EYE_COLORS };
    })();

    /* ====== ESTADO PRINCIPAL DO ENTALHO AURA ====== */
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    const st = {
      expanded: false,
      view: 'home',
      mood: 'idle',
      statusText: 'Pronto',
      level: 1,
      xpPercent: 10,
      cpu: 0,
      ram: 0,
      pomo: { active: false, formatted: '00:00', label: '' },
      tasks: [],
      habits: { water: 0, read: 0, exercise: 0 },
      mascot: {
        name: 'AURA',
        body: '#F4F7FF',
        body2: '#BFCDF5',
        visor: '#1B1E2B',
        eye: '#9BF35A',
        eyeStyle: 'round',
        accessory: 'none',
        silentMode: false,
        voiceSpeak: true,
      },
      chat: [],
      work: null,
      listening: false,
      playingMedia: false,
      clipboard: [],
      remote: { active_qr_url: '', cloud_channel: '--' },
      termOutput: '$ Terminal rápido pronto. Digite um comando abaixo.',
      lastActivity: Date.now(),
    };

    const notch = document.getElementById('notch');
    const pill = document.getElementById('pill');
    const side = document.getElementById('side');
    const dmain = document.getElementById('dmain');

    function K(size, mood, uid) {
      return AURA_MASCOT.svg({
        size,
        mood: mood || st.mood,
        body: st.mascot.body,
        body2: st.mascot.body2,
        visor: st.mascot.visor,
        eye: st.mascot.eye,
        eyeStyle: st.mascot.eyeStyle,
        accessory: st.mascot.accessory,
        uid: uid || 'm',
      });
    }

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.style.opacity = '1';
      clearTimeout(toast._t);
      toast._t = setTimeout(() => { el.style.opacity = '0'; }, 2400);
    }

    function setMood(m, ms, status) {
      st.mood = m;
      if (status) st.statusText = status;
      st.lastActivity = Date.now();
      clearTimeout(setMood._t);
      if (ms) {
        setMood._t = setTimeout(() => {
          st.mood = 'idle';
          st.statusText = 'Pronto';
          render();
        }, ms);
      }
      render();
    }

    function speakText(text) {
      if (st.mascot.silentMode || !st.mascot.voiceSpeak || !('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        const clean = String(text).replace(/[*_`#<>]/g, '').slice(0, 220);
        const ut = new SpeechSynthesisUtterance(clean);
        ut.lang = 'pt-BR';
        ut.rate = 1.08;
        window.speechSynthesis.speak(ut);
      } catch (e) {}
    }

    /* ====== CONTROLE DE EXPANSÃO (pywebview + browser) ====== */
    let lastPillW = 210;
    async function syncPillWidth(w) {
      if (st.expanded || w === lastPillW) return;
      lastPillW = w;
      try {
        if (window.pywebview && window.pywebview.api && window.pywebview.api.set_pill_width) {
          await window.pywebview.api.set_pill_width(w);
        }
      } catch (e) {}
    }

    async function setDrawerState(expanded, notifyBackend = true) {
      st.expanded = Boolean(expanded);
      document.body.classList.toggle('expanded', st.expanded);
      st.lastActivity = Date.now();
      if (st.mood === 'sleep' && st.expanded) {
        st.mood = 'idle';
        st.statusText = 'Pronto';
      }
      render();
      if (notifyBackend) {
        try {
          if (window.pywebview && window.pywebview.api && window.pywebview.api.set_expanded) {
            await window.pywebview.api.set_expanded(st.expanded);
          } else {
            await fetch('/api/hud/control', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: st.expanded ? 'expand' : 'collapse' })
            });
          }
        } catch (e) {}
      }
    }
    window.setDrawerState = setDrawerState;

    let closeTimer = null;
    notch.addEventListener('mouseenter', () => {
      clearTimeout(closeTimer);
      if (!st.expanded) setDrawerState(true, true);
    });
    notch.addEventListener('mouseleave', () => {
      const active = document.activeElement;
      if (active && (active.tagName === 'INPUT' || active.tagName === 'SELECT')) return;
      closeTimer = setTimeout(() => {
        if (st.expanded) setDrawerState(false, true);
      }, 650);
    });
    pill.addEventListener('click', () => setDrawerState(true, true));

    /* ====== RENDERIZAÇÃO DA PILL TOPO ====== */
    function renderPill() {
      let live = '';
      let dotCls = 'dot';
      if (st.listening) {
        dotCls = 'dot listen';
        live = `<span class="live" style="color:#FF453A">Ouvindo…</span>`;
      } else if (st.work) {
        dotCls = 'dot think';
        live = `<span class="live work"><span class="wk">${st.work.icon}</span><span class="nm">${esc(st.work.label)}…</span></span>`;
      } else if (st.pomo && st.pomo.active) {
        live = `<span class="live">⏱ <span class="nm">${esc(st.pomo.label || 'Foco')}</span><span>${esc(st.pomo.formatted)}</span></span>`;
      } else if (st.playingMedia) {
        live = `<span class="live"><span class="eq"><b></b><b></b><b></b></span><span class="nm">${esc(st.mascot.name)}</span></span>`;
      } else {
        live = `<span class="live"><span class="nm">${esc(st.mascot.name)} · ${st.cpu}%</span></span>`;
      }
      pill.innerHTML = `${K(28, st.mood, 'pill')}<span class="${dotCls}"></span>${live}`;
      syncPillWidth((st.pomo.active || st.work) ? 280 : 200);
    }

    /* ====== RENDERIZAÇÃO DA BARRA LATERAL ====== */
    const NAV = [
      ['home', '🏠', 'Início'],
      ['tasks', '✅', 'Tarefas'],
      ['habits', '💧', 'Hábitos'],
      ['timers', '⏱', 'Timers'],
      ['music', '🎵', 'Música'],
      ['system', '⚡', 'Sistema'],
      ['visual', '🎨', 'Visual'],
    ];

    function renderSide() {
      const openTasks = st.tasks.filter(t => !t.done).length;
      const counts = {
        tasks: openTasks || '',
        habits: `${st.habits.water}/8`,
        timers: st.pomo.active ? '1' : '',
      };
      side.innerHTML = `
        <div class="me">
          ${K(44, st.mood, 'side')}
          <div style="min-width:0">
            <b>${esc(st.mascot.name)}</b>
            <small>● ${esc(st.statusText)}</small>
            <div class="lv"><em>Nv ${st.level}</em><i><b style="width:${st.xpPercent}%"></b></i></div>
          </div>
        </div>
        ${NAV.map(([k, i, l]) => `<button class="nv${st.view === k ? ' on' : ''}" data-v="${k}">${i} ${l}${counts[k] ? `<span class="c">${counts[k]}</span>` : ''}</button>`).join('')}
        <div class="side-foot">
          <button class="sbtn primary" data-act="open-app" title="Abrir Quadro Maestri 2D Completo">Maestri 2D</button>
          <button class="sbtn" data-act="collapse" title="Recolher entalho">▲</button>
        </div>
      `;
    }

    /* ====== VIEWS PRINCIPAIS ====== */
    const SUGG = [
      'Como está meu PC?',
      'Ative o modo dev',
      'Listar minhas tarefas',
      'Organiza minha área de trabalho',
      'Timer de 25 minutos foco',
      'Conta uma piada',
    ];

    function vHome() {
      const msgsHtml = st.chat.length
        ? st.chat.map(m => `<div class="m ${m[0]}">${esc(m[1]).replace(/\n/g, '<br>')}</div>`).join('')
        : `<div style="margin:auto;color:var(--mist);font-size:12.5px;text-align:center">Oi! Eu sou a ${esc(st.mascot.name)} 👋<br>Fale comigo ou toque numa sugestão acima.</div>`;
      return `
        <div class="main-head">
          <div><h4>Olá!</h4><div class="sub">Fale ou digite um comando para a ${esc(st.mascot.name)}</div></div>
        </div>
        <div class="ask">
          <input type="text" id="askInput" placeholder="Escreva ou fale com a ${esc(st.mascot.name)}…" autocomplete="off" />
          <button class="ask-send" id="askSend" title="Enviar">↵</button>
          <button class="mic${st.listening ? ' on' : ''}" id="micBtn" title="Falar (Voz)">
            <svg viewBox="0 0 24 24" fill="currentColor"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="chips">${SUGG.map(s => `<button class="chip" data-say="${esc(s)}">${esc(s)}</button>`).join('')}</div>
        <div class="hmid">
          <div class="convo" id="convo">${msgsHtml}</div>
          <div class="mini">
            <div class="top">
              <div class="art">🎵</div>
              <div style="min-width:0"><b>Mídia & PC</b><small>Controle rápido</small></div>
            </div>
            <div class="ctl">
              <button data-media="vol_down" title="Volume -">🔉</button>
              <button data-media="prev" title="Anterior">⏮</button>
              <button class="pp" data-media="play_pause" title="Play / Pause">${st.playingMedia ? '❚❚' : '▶'}</button>
              <button data-media="next" title="Próxima">⏭</button>
              <button data-media="vol_up" title="Volume +">🔊</button>
            </div>
            <div class="mini-stats">
              <span>CPU <b>${st.cpu}%</b></span>
              <span>RAM <b>${st.ram}%</b></span>
            </div>
          </div>
        </div>
      `;
    }

    function vTasks() {
      const list = st.tasks.length
        ? st.tasks.map(t => `
          <div class="row${t.done ? ' done' : ''}">
            <button class="ck${t.done ? ' on' : ''}" data-toggle-task="${t.id}">${t.done ? '✓' : ''}</button>
            <div class="t">${esc(t.title)}<small>${esc(t.category || 'Geral')}${t.due_time ? ' · ' + esc(t.due_time) : ''}</small></div>
            <button class="rb" data-del-task="${t.id}" title="Excluir" style="font-size:11px;color:var(--mist)">✕</button>
          </div>`).join('')
        : '<div class="sub">Nenhuma tarefa ainda. Adicione uma acima!</div>';
      return `
        <h4>Tarefas</h4>
        <div class="sub">Toque no círculo para concluir (+XP!)</div>
        <div class="ask" style="margin-bottom:8px;">
          <input type="text" id="newTaskInput" placeholder="Nova tarefa rápida…" autocomplete="off" />
          <button class="ask-send" id="addTaskBtn" title="Adicionar">+</button>
        </div>
        <div class="scroll-area">${list}</div>
      `;
    }

    function vHabits() {
      const w = st.habits.water || 0;
      const r = st.habits.read || 0;
      const e = st.habits.exercise || 0;
      return `
        <h4>Hábitos</h4>
        <div class="sub">Pequenas vitórias de hoje</div>
        <div class="scroll-area">
          <div class="row">
            <span style="font-size:20px">💧</span>
            <div class="t">Água <small>${w}/8 copos${w >= 8 ? ' · ✅ Meta batida!' : ''}</small><div class="bar"><i style="width:${Math.min(100, w / 8 * 100)}%"></i></div></div>
            <button class="rb" data-habit="water" data-delta="-1">−</button>
            <button class="rb plus" data-habit="water" data-delta="1">+</button>
          </div>
          <div class="row">
            <span style="font-size:20px">📖</span>
            <div class="t">Ler <small>${r}/1 vez${r >= 1 ? ' · ✅' : ''}</small><div class="bar"><i style="width:${r >= 1 ? 100 : 0}%"></i></div></div>
            <button class="rb plus" data-habit="read" data-delta="1">${r >= 1 ? '✓' : '+'}</button>
          </div>
          <div class="row">
            <span style="font-size:20px">🏃</span>
            <div class="t">Exercício / Pausa <small>${e}/1 vez${e >= 1 ? ' · ✅' : ''}</small><div class="bar"><i style="width:${e >= 1 ? 100 : 0}%"></i></div></div>
            <button class="rb plus" data-habit="exercise" data-delta="1">${e >= 1 ? '✓' : '+'}</button>
          </div>
        </div>
      `;
    }

    function vTimers() {
      return `
        <h4>Timers & Foco</h4>
        <div class="sub">O timer corre no topo da tela e notifica no celular</div>
        <div class="chips" style="margin:0 0 12px">
          ${[['Chá', 1], ['Pizza', 5], ['Foco', 25], ['Deep Work', 50]].map(([n, m]) => `<button class="chip" data-timer="${m}" data-tn="${n}">${n} · ${m} min</button>`).join('')}
        </div>
        ${st.pomo.active
          ? `<div class="row"><div class="t">${esc(st.pomo.label || 'Foco')}<small>correndo agora</small></div><span class="tm">${esc(st.pomo.formatted)}</span><button class="rb" data-stop-timer="1" title="Parar">✕</button></div>`
          : '<div class="row"><div class="t">Nenhum timer ativo<small>Escolha um preset acima para começar</small></div></div>'}
      `;
    }

    function vMusic() {
      return `
        <h4>Música & Mídia</h4>
        <div class="sub">Controle global de áudio do computador</div>
        <div class="row" style="padding:14px;gap:14px;">
          <div style="width:68px;height:68px;border-radius:14px;background:linear-gradient(135deg,#2b4a1e,#161829);display:grid;place-items:center;font-size:28px;flex:none;">🎵</div>
          <div style="flex:1;min-width:0;">
            <b style="font:800 16px var(--font-display);display:block;">Player do Sistema</b>
            <small style="color:var(--mist);font-size:12px;">Spotify, YouTube ou Mídia ativa</small>
            <div class="ctl" style="justify-content:flex-start;margin-top:10px;gap:8px;">
              <button data-media="prev" title="Anterior">⏮</button>
              <button class="pp" data-media="play_pause" title="Tocar / Pausar">${st.playingMedia ? '❚❚' : '▶'}</button>
              <button data-media="next" title="Próxima">⏭</button>
              <button data-media="vol_down" title="Volume -">🔉</button>
              <button data-media="vol_up" title="Volume +">🔊</button>
              <button data-media="mute" title="Mudo">🔇</button>
            </div>
          </div>
        </div>
        <div class="chips">
          <button class="chip" data-open="spotify">Abrir Spotify</button>
          <button class="chip" data-open="youtube">Abrir YouTube</button>
        </div>
      `;
    }

    function vSystem() {
      const qr = st.remote.active_qr_url
        ? `<img src="https://api.qrserver.com/v1/create-qr-code/?size=74x74&data=${encodeURIComponent(st.remote.active_qr_url)}" style="width:68px;height:68px;border-radius:8px;background:#fff;padding:3px;" alt="QR" />`
        : '';
      return `
        <h4>Sistema & Maestri</h4>
        <div class="sub">Atalhos rápidos, terminal e acesso celular 4G/5G</div>
        <div class="scroll-area">
          <div class="sys-grid">
            <button class="sys-tile" data-routine="dev">💻 Modo Dev</button>
            <button class="sys-tile" data-routine="study">📚 Modo Estudo</button>
            <button class="sys-tile" data-routine="clean">🧹 Modo Faxina</button>
            <button class="sys-tile" data-shot="1">📸 Capturar Tela</button>
            <button class="sys-tile" data-power="lock">🔒 Bloquear PC</button>
            <button class="sys-tile" data-act="hide">👻 Ocultar HUD</button>
          </div>
          <div class="ask">
            <input type="text" id="termInput" placeholder="Comando rápido (ls, dir, git status, python --version)…" style="font-family:var(--font-mono);font-size:12px;" />
            <button class="ask-send" id="termSend">▶</button>
          </div>
          <div class="term-box" id="termBox">${esc(st.termOutput)}</div>
          ${qr ? `<div class="row" style="margin-top:8px;">${qr}<div class="t">Celular 4G/5G<small style="user-select:text;">${esc(st.remote.active_qr_url)}</small></div></div>` : ''}
        </div>
      `;
    }

    function vVisual() {
      return `
        <h4>Personalizar ${esc(st.mascot.name)}</h4>
        <div class="sub">Cor, olhos, acessórios e voz</div>
        <div class="scroll-area">
          <div class="cust-sec">
            <label>Nome</label>
            <div class="ask" style="padding:4px 12px;">
              <input type="text" id="nameInput" value="${esc(st.mascot.name)}" maxlength="20" />
              <button class="ask-send" id="saveNameBtn">✓</button>
            </div>
          </div>
          <div class="cust-sec">
            <label>Cor do Corpo</label>
            <div class="swatches">
              ${AURA_MASCOT.BODIES.map(([n, b1, b2]) => `<button class="swatch${st.mascot.body === b1 ? ' on' : ''}" data-body1="${b1}" data-body2="${b2}" title="${n}" style="background:linear-gradient(135deg,${b1},${b2})"></button>`).join('')}
            </div>
          </div>
          <div class="cust-sec">
            <label>Cor dos Olhos</label>
            <div class="swatches">
              ${AURA_MASCOT.EYE_COLORS.map(c => `<button class="swatch${st.mascot.eye === c ? ' on' : ''}" data-eyec="${c}" style="background:${c}"></button>`).join('')}
            </div>
          </div>
          <div class="cust-sec">
            <label>Estilo dos Olhos</label>
            <div class="chips" style="margin-top:0;">
              ${Object.entries(AURA_MASCOT.EYES).map(([k, l]) => `<button class="chip" style="${st.mascot.eyeStyle === k ? 'background:rgba(155,243,90,.22);color:var(--glow)' : ''}" data-eyes="${k}">${l}</button>`).join('')}
            </div>
          </div>
          <div class="cust-sec">
            <label>Acessórios</label>
            <div class="chips" style="margin-top:0;">
              ${Object.entries(AURA_MASCOT.ACCESSORIES).map(([k, l]) => `<button class="chip" style="${st.mascot.accessory === k ? 'background:rgba(155,243,90,.22);color:var(--glow)' : ''}" data-acc="${k}">${l}</button>`).join('')}
            </div>
          </div>
          <div class="cust-sec">
            <label>Modo de Voz</label>
            <div class="chips" style="margin-top:0;">
              <button class="chip" data-voice="toggle">${st.mascot.silentMode ? '🤫 Modo só executar (mudo)' : '🔊 Responder em voz alta'}</button>
            </div>
          </div>
        </div>
      `;
    }

    const VIEWS = { home: vHome, tasks: vTasks, habits: vHabits, timers: vTimers, music: vMusic, system: vSystem, visual: vVisual };

    function render() {
      renderPill();
      if (st.expanded) {
        const activeId = document.activeElement && document.activeElement.id;
        const activeVal = activeId && document.activeElement.value;
        renderSide();
        dmain.innerHTML = VIEWS[st.view]();
        const c = document.getElementById('convo');
        if (c) c.scrollTop = c.scrollHeight;
        if (activeId && document.getElementById(activeId)) {
          const el = document.getElementById(activeId);
          el.value = activeVal;
          el.focus();
        }
      }
      lookEyes();
    }

    /* ====== AÇÕES E BACKEND ====== */
    async function saveHudState(payload) {
      try {
        await fetch('/api/hud/state', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
      } catch (e) {}
    }

    async function sendChat(text) {
      const msg = (text || '').trim();
      if (!msg) return;
      st.chat.push(['u', msg]);
      st.chat = st.chat.slice(-12);
      setMood('think', 0, 'Pensando…');
      st.work = { icon: '✨', label: 'Pensando' };
      render();
      try {
        const r = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg }),
        });
        const d = await r.json();
        st.work = null;
        const reply = d.reply || 'Feito!';
        st.chat.push(['k', reply]);
        st.chat = st.chat.slice(-12);
        speakText(reply);
        setMood('happy', 3200, 'Pronto');
        refreshAll();
      } catch (e) {
        st.work = null;
        st.chat.push(['k', 'Ops, não consegui falar com o servidor agora.']);
        setMood('surprised', 2500, 'Erro');
      }
    }

    /* Reconhecimento de Voz (Web Speech API) */
    function toggleVoice() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        toast('🎙 Voz indisponível neste navegador; digite no campo!');
        return;
      }
      if (st.listening && window._auraRec) {
        window._auraRec.stop();
        return;
      }
      const rec = new SR();
      rec.lang = 'pt-BR';
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      window._auraRec = rec;
      st.listening = true;
      setMood('listen', 0, 'Ouvindo…');
      rec.onresult = (ev) => {
        const transcript = ev.results[0][0].transcript;
        st.listening = false;
        sendChat(transcript);
      };
      rec.onerror = () => {
        st.listening = false;
        setMood('idle', 0, 'Pronto');
        toast('🎙 Não entendi, tente novamente');
      };
      rec.onend = () => {
        if (st.listening) {
          st.listening = false;
          setMood('idle', 0, 'Pronto');
        }
      };
      rec.start();
    }

    /* Eventos delegados */
    notch.addEventListener('click', async (e) => {
      st.lastActivity = Date.now();
      const b = e.target.closest('button');
      if (!b) return;
      const d = b.dataset;

      if (d.v) { st.view = d.v; render(); return; }
      if (d.act === 'collapse') { setDrawerState(false, true); return; }
      if (d.act === 'hide') {
        try {
          if (window.pywebview?.api?.hide_to_tray) await window.pywebview.api.hide_to_tray();
          else await fetch('/api/hud/control', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'hide' }) });
        } catch (err) {}
        return;
      }
      if (d.act === 'open-app') {
        try {
          if (window.pywebview?.api?.open_full_app) await window.pywebview.api.open_full_app();
          else window.open('/', '_blank');
        } catch (err) { window.open('/', '_blank'); }
        return;
      }

      if (b.id === 'askSend') {
        const inp = document.getElementById('askInput');
        if (inp) { const v = inp.value; inp.value = ''; sendChat(v); }
        return;
      }
      if (b.id === 'micBtn') { toggleVoice(); return; }
      if (d.say) { sendChat(d.say); return; }

      if (b.id === 'addTaskBtn') {
        const inp = document.getElementById('newTaskInput');
        const title = inp && inp.value.trim();
        if (!title) return;
        inp.value = '';
        await fetch('/api/tasks', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title, category: 'Geral', priority: 'media', due_time: 'Hoje' }) });
        toast('✅ Tarefa adicionada');
        setMood('happy', 1800, 'Pronto');
        refreshTasks();
        return;
      }
      if (d.toggleTask) {
        await fetch(`/api/tasks/${d.toggleTask}/toggle`, { method: 'POST' });
        setMood('success', 2000, 'Boa!');
        toast('✅ Tarefa atualizada!');
        refreshTasks();
        return;
      }
      if (d.delTask) {
        await fetch(`/api/tasks/${d.delTask}`, { method: 'DELETE' });
        refreshTasks();
        return;
      }

      if (d.habit) {
        const k = d.habit;
        const delta = Number(d.delta || 1);
        const max = k === 'water' ? 8 : 1;
        st.habits[k] = Math.max(0, Math.min(max, (st.habits[k] || 0) + delta));
        if (delta > 0) setMood(k === 'water' ? 'love' : 'success', 1800, 'Boa!');
        render();
        saveHudState({ habits: st.habits });
        return;
      }

      if (d.timer) {
        await fetch('/api/pomodoro/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ minutes: Number(d.timer), label: d.tn }) });
        toast(`⏱ Timer "${d.tn}" iniciado`);
        setMood('cool', 1800, 'Foco');
        refreshTelemetry();
        return;
      }
      if (d.stopTimer) {
        await fetch('/api/pomodoro/stop', { method: 'POST' });
        toast('⏹ Timer parado');
        refreshTelemetry();
        return;
      }

      if (d.media) {
        if (d.media === 'play_pause') st.playingMedia = !st.playingMedia;
        await fetch('/api/system/media', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: d.media }) });
        render();
        return;
      }
      if (d.open) {
        await fetch('/api/system/open', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ target: d.open }) });
        toast(`🚀 Abrindo ${d.open}`);
        return;
      }

      if (d.routine) {
        setMood('think', 0, 'Executando…');
        const r = await fetch('/api/system/routine', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ routine_id: d.routine }) });
        const res = await r.json();
        toast(res.message || 'Rotina executada!');
        setMood('success', 2200, 'Pronto');
        return;
      }
      if (d.shot) {
        const r = await fetch('/api/system/screenshot', { method: 'POST' });
        const res = await r.json();
        toast(res.message || '📸 Tela capturada');
        return;
      }
      if (d.power) {
        const r = await fetch('/api/system/power', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: d.power, delay_minutes: 30 }) });
        const res = await r.json();
        toast(res.message || 'Feito');
        return;
      }
      if (b.id === 'termSend') {
        const inp = document.getElementById('termInput');
        const cmd = inp && inp.value.trim();
        if (!cmd) return;
        inp.value = '';
        st.termOutput += `\n> ${cmd}\nExecutando…`;
        render();
        const r = await fetch('/api/terminal/input', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ node_id: 'hud-term', raw_input: cmd, agent_name: 'AURA Terminal', mode: 'auto' })
        });
        const res = await r.json();
        const sess = res.terminal_session || res.session;
        if (sess && sess.history) {
          st.termOutput = sess.history.slice(-3).map(h => `$ ${h.cmd}\n${h.output}`).join('\n\n');
        }
        render();
        return;
      }

      /* Personalização */
      if (b.id === 'saveNameBtn') {
        const inp = document.getElementById('nameInput');
        if (inp && inp.value.trim()) {
          st.mascot.name = inp.value.trim().slice(0, 20);
          toast(`✨ Nome alterado para ${st.mascot.name}`);
          render();
          saveHudState({ mascot: st.mascot });
        }
        return;
      }
      if (d.body1) {
        st.mascot.body = d.body1;
        st.mascot.body2 = d.body2;
        setMood('love', 1400, 'Adorei!');
        saveHudState({ mascot: st.mascot });
        return;
      }
      if (d.eyec) {
        st.mascot.eye = d.eyec;
        setMood('happy', 1200, 'Pronto');
        saveHudState({ mascot: st.mascot });
        return;
      }
      if (d.eyes) {
        st.mascot.eyeStyle = d.eyes;
        render();
        saveHudState({ mascot: st.mascot });
        return;
      }
      if (d.acc) {
        st.mascot.accessory = d.acc;
        setMood('cool', 1400, 'Estiloso!');
        saveHudState({ mascot: st.mascot });
        return;
      }
      if (d.voice) {
        st.mascot.silentMode = !st.mascot.silentMode;
        toast(st.mascot.silentMode ? '🤫 Modo só executar ativado' : '🔊 Voz ativada');
        render();
        saveHudState({ mascot: st.mascot });
      }
    });

    notch.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      if (e.target.id === 'askInput') { const v = e.target.value; e.target.value = ''; sendChat(v); }
      if (e.target.id === 'newTaskInput') { document.getElementById('addTaskBtn')?.click(); }
      if (e.target.id === 'termInput') { document.getElementById('termSend')?.click(); }
      if (e.target.id === 'nameInput') { document.getElementById('saveNameBtn')?.click(); }
    });

    /* Olhos seguem o mouse */
    let mx = window.innerWidth / 2, my = 0;
    function lookEyes() {
      document.querySelectorAll('[data-eyes]').forEach((g) => {
        const svg = g.ownerSVGElement;
        if (!svg) return;
        const r = svg.getBoundingClientRect();
        const dx = mx - (r.left + r.width / 2);
        const dy = my - (r.top + r.height / 2);
        const len = Math.hypot(dx, dy) || 1;
        const k = Math.min(1, len / 400);
        g.setAttribute('transform', `translate(${(dx / len * 1.8 * k).toFixed(2)} ${(dy / len * 1.4 * k).toFixed(2)})`);
      });
    }
    window.addEventListener('pointermove', (e) => {
      mx = e.clientX;
      my = e.clientY;
      requestAnimationFrame(lookEyes);
    }, { passive: true });

    /* ====== POLLING DE DADOS REAIS ====== */
    async function refreshTelemetry() {
      try {
        const r = await fetch('/api/system/stats');
        const d = await r.json();
        st.cpu = Math.round(d.cpu?.percent || 0);
        st.ram = Math.round(d.ram?.percent || 0);
        if (d.pomodoro) st.pomo = d.pomodoro;
        if (d.remote) st.remote = d.remote;
      } catch (e) {}
      try {
        const mr = await fetch('/api/memory');
        const md = await mr.json();
        st.level = md.level || 1;
        st.xpPercent = md.progress_percent || 0;
      } catch (e) {}
      render();
    }

    async function refreshTasks() {
      try {
        const r = await fetch('/api/tasks');
        const d = await r.json();
        st.tasks = d.tasks || [];
        render();
      } catch (e) {}
    }

    async function loadHudState() {
      try {
        const r = await fetch('/api/hud/state');
        const d = await r.json();
        if (d.habits) st.habits = d.habits;
        if (d.mascot) st.mascot = { ...st.mascot, ...d.mascot };
        render();
      } catch (e) {}
    }

    function refreshAll() {
      refreshTelemetry();
      refreshTasks();
    }

    /* Modo soneca após 45s sem interação */
    setInterval(() => {
      if (!st.expanded && st.mood === 'idle' && !st.listening && !st.work && !st.pomo.active) {
        if (Date.now() - st.lastActivity > 45000) {
          st.mood = 'sleep';
          st.statusText = 'Cochilando';
          render();
        }
      }
    }, 5000);

    loadHudState();
    refreshAll();
    setInterval(refreshTelemetry, 2000);
    setInterval(refreshTasks, 10000);
  </script>
</body>
</html>
